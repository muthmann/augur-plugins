[workspace]
members = [
  "evesmlm-types",
  "stage-a-io",
  "stage-a-plugin-contract",
  "stage-a-sine-acquisition",
  "stage-a-universal-runner",
  "plugins/stage-a-universal-runner",
  "plugins/stage-a-a5",
  "plugins/stage-a-a1",
  "plugins/stage-a-a3",
  "plugins/stage-a-a2",
  "plugins/stage-a-a4",
  "plugins/stage-a-modulation",
  "plugins/stage-a-photodiode",
  "plugins/localization",
  "plugins/reconstruction",
  "plugins/focus-metrics",
  "plugins/evesmlm-candidates",
  "plugins/evesmlm-fitting",
  "plugins/evesmlm-postproc",
  "plugin-template",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"
authors = ["Mika Uthmann <muthmann@physik.uni-bielefeld.de>"]
repository = "https://github.com/muthmann/augur-plugins"

[workspace.dependencies]
augur-core = { path = "../augur-rs/augur-core" }
augur-plugin-api = { path = "../augur-rs/augur-plugin-api" }
augur-plugin-types = { path = "../augur-rs/augur-plugin-types" }
egui = "0.27"
evesmlm-types = { path = "evesmlm-types" }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
stage-a-plugin-contract = { path = "stage-a-plugin-contract" }
