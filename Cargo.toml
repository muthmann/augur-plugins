[workspace]
members = [
  "plugins/hotpixel",
  "plugins/roi-grid",
  "plugins/localization",
  "plugins/focus-metrics",
  "plugins/evesmlm-candidates",
  "plugins/evesmlm-fitting",
  "plugins/evesmlm-postproc",
  "plugin-template",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Mika Uthmann <muthmann@physik.uni-bielefeld.de>"]
repository = "https://github.com/muthmann/augur-plugins"

[workspace.dependencies]
augur-core = { git = "https://github.com/muthmann/augur-rs.git" }
egui = "0.27"
rustfft = "6"
