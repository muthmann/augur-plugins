# Short operator smoke test for the universal runner.
# This validates dispatch, camera-state handoff, AOD confirmation metadata,
# explicit block completion and resume identity. It is not scientific data.
name = "stage-a-smoke-test"
overhead_s_per_point = 1.0

[[block]]
experiment = "A1"
name = "a1-dispatch"
protocol = ""
 [block.camera]
 diff_on = -15
 diff_off = -2
 fo = 55
 hpf = 0
 refr = 235
 filters_off = true
[[block.points]]
label = "A1_smoke"
duration_s = 2
settle_s = 1
repeats = 1

