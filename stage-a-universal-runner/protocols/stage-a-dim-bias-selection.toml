# Stage-A dim-bias selection, version 20260910-v2
# Six complete candidate states at each application light level. This is a
# screening campaign, not a fitted A1/A3 result. All observations remain in
# the campaign folder for offline multi-objective selection.
name = "stage-a-dim-bias-selection"
version = "20260910-v3"
program = "dim_bias_selection"
overhead_s_per_point = 11.0

[[optical_states]]
id = "F1"
label = "application low light"
operator_action = "Set AOD to the saved low-light setting."
target_camera_lux = "about 0.8 (1/10 of F0)"
pause_before = true

[[optical_states]]
id = "F2"
label = "application very low light"
operator_action = "Set AOD to the saved darker setting."
target_camera_lux = "about 0.08 (1/100 of F0)"
pause_before = true

# Each block is deliberately self-describing. The delegated experiment must
# apply and read back all five fields before recording.
[[block]]
experiment = "A4"
name = "F1-B0"
protocol = "a4_bias_selection"
optical_state = "F1"
retry_same_point = true
[block.camera]
diff_on = 0
diff_off = 0
fo = 0
hpf = 0
refr = 235
filters_off = true
[[block.points]]
label = "F1_B0_background"
duration_s = 120
settle_s = 10

[[block]]
experiment = "A4"
name = "F1-B1"
protocol = "a4_bias_selection"
optical_state = "F1"
retry_same_point = true
[block.camera]
