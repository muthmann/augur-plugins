[package]
name = "stage-a-plugin-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mika Uthmann <muthmann@physik.uni-bielefeld.de>"]
description = "Serde-only inter-plugin control and status contract for the Stage-A device-owner plugins"

[dependencies]
augur-plugin-api.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

