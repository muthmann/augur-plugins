id = "stage-a.a4"
name = "Stage-A A4 Threshold"
version = "0.1.0"
description = "Stage-A A4 contrast-threshold survey: steps diff_on/diff_off through a protocol at one fixed optical condition, confirming every point against the sensor's own bias readback before it records."
domain = "stage-a"
library = "augur_plugin_stage_a_a4"
phase = "raw_events"
min_augur_version = "1.0.0"
host_commands = [
  "start_recording",
  "stop_recording",
  "apply_camera_configuration",
  "restore_camera_configuration",
]
