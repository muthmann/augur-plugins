# Complete A2 point sequence for the current ATTO647 fluorescence chain.
#
# This file describes only what to record. The runner reads camera,
# modulation, photodiode and comparator provenance from their owners and writes
# it into each measurement sidecar.
name = "a2-atto647-fluorescence-chain-followup"

# Dark/sham and cadence commissioning. A pause means the operator must confirm
# the stated physical condition before Continue. No failed row is overwritten.
[[point]]
label="floor_pre"
role="floor_pre_shutter_closed"
acquisition_mode="dark"
duration_s=30.0
settle_s=2
pause_before=true

[[point]]
label="blocked_drive_sham"
role="blocked_drive_sham"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=100
settle_s=2
pause_before=true

[[point]]
label="polarity_cadence_2s"
role="commissioning"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=2.0
transitions_per_polarity=50
settle_s=3
pause_before=true

[[point]]
label="cadence_1s"
role="commissioning"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=50
settle_s=3

[[point]]
label="cadence_0p5s"
role="commissioning_conditional"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=0.5
transitions_per_polarity=50
settle_s=3
pause_before=true

[[point]]
label="load_small"
role="h21_load_reference"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=200
settle_s=3

[[point]]
label="load_larger"
role="h21_load_test"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=200
settle_s=3
pause_before=true

# Opening references and the multi-depth identification block at mean_u=0.30.
[[point]]
label="ref_open_1"
role="reference"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=200
settle_s=3
[[point]]
label="ref_open_2"
role="reference"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=200
settle_s=3
[[point]]
label="ref_open_3"
role="reference"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=200
settle_s=3
[[point]]
label="depth_low"
role="identification"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.28
half_period_s=1.0
transitions_per_polarity=500
settle_s=3
[[point]]
label="depth_high"
role="identification"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.80
half_period_s=1.0
transitions_per_polarity=500
settle_s=3

# Flux/pedestal bridge matching A1. The order is non-monotonic to expose drift.
[[point]]
label="pedestal_u015"
role="pedestal_core"
acquisition_mode="stepped"
mean_u=0.15
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=500
settle_s=3
[[point]]
label="pedestal_u045"
role="pedestal_core"
acquisition_mode="stepped"
mean_u=0.45
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=500
settle_s=3
[[point]]
label="pedestal_u030"
role="pedestal_core"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=500
settle_s=3

[[point]]
label="ref_close"
role="reference"
acquisition_mode="stepped"
mean_u=0.30
depth_a=0.45
half_period_s=1.0
transitions_per_polarity=200
